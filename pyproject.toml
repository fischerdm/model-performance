[project]
name = "modelperf"
version = "0.1.0"
description = "Documented, worked examples of measuring model performance and drift."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.7",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyter>=1.0",  # Quarto executes Python cells through a Jupyter kernel
    "nbformat>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelperf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
